name: Python leaderboard tests

on:
  push:
    branches: [review]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 pinned
        with:
          persist-credentials: false
      - name: Compile and run regression suite
        run: |
          python3 -m py_compile test.py test_review.py
          python3 -m unittest -v test_review
